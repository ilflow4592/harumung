services:
  mysql:
    image: mysql:8.4
    container_name: harumung-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: harumung
      MYSQL_USER: harumung
      MYSQL_PASSWORD: harumung
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports:
      - "3306:3306"
    volumes:
      - harumung-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uharumung", "-pharumung"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  harumung-mysql:
